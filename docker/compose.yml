# Local/dev stack. Coolify: create one service per client from docker/Dockerfile, plus a managed Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farm_pizza
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farm_pizza"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { CLIENT_SLUG: farm-pizza }
    # Optional local secrets (Stripe/Resend/Twilio). Values in `environment:`
    # below always win, so DATABASE_URL etc. stay container-correct.
    env_file:
      - path: ../.env
        required: false
    environment:
      # Only values that must be container-correct live here. Secrets are
      # deliberately absent: anything in `environment:` beats `env_file:`, so
      # putting a password here would silently override ../.env and pin the
      # stack to it - which is exactly how an admin panel ends up on "admin".
      CLIENT_SLUG: farm-pizza
      DATABASE_URL: postgresql://postgres:postgres@db:5432/farm_pizza
      # Falls back to the container's own address, but ../.env wins - point it
      # at the tunnel or domain when the stack is reachable from outside.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: {}
